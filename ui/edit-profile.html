<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Teammate Matcher</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand"> Teammate Matcher</a>
            <div class="nav-links" id="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="alert-container"></div>

        <div class="auth-container">
            <div class="auth-card">
                <h1>Edit Profile</h1>
                <p class="auth-subtitle">Update your information to improve matching</p>

                <form id="edit-profile-form" class="auth-form">
                    <div class="form-group">
                        <label for="display_name">Display Name *</label>
                        <input type="text" id="display_name" name="display_name" required>
                    </div>

                    <div class="form-group">
                        <label for="contact_info">Contact Email</label>
                        <input type="email" id="contact_info" name="contact_info"
                               placeholder="e.g. john@example.com">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">Cohort City *</label>
                            <select id="city" name="city" required>
                                <option value="HK">Hong Kong (HK)</option>
                                <option value="SH">Shanghai (SH)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="preferred_role">Preferred Role *</label>
                            <select id="preferred_role" name="preferred_role" required>
                                <option value="Frontend">Frontend</option>
                                <option value="Backend">Backend</option>
                                <option value="Database">Database</option>
                                <option value="Agentic Development">Agentic Development</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="languages">Languages</label>
                        <input type="text" id="languages" name="languages"
                               placeholder="e.g. Mandarin, English, Cantonese">
                        <small class="form-hint">Comma-separated list</small>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="in_team" name="in_team" value="1" disabled>
                            Already in a team (managed by the course demo data)
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>AILT9019 - AI Literacy for Computing and Data Science | HKU 2026-27</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
