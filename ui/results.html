<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Results - Teammate Matcher</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand"> Teammate Matcher</a>
            <div class="nav-links" id="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="edit-profile.html">Edit Profile</a>
                <a href="#" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="alert-container"></div>

        <div class="results-page">
            <div class="results-header">
                <h1>🎉 Your Teammates</h1>
                <p class="results-subtitle">
                    Matched for <strong id="user-name">-</strong>
                    (<span id="user-city">-</span>, <span id="user-role">-</span>)
                </p>
            </div>

            <!-- Stats Summary -->
            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">Total Pool</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="stat-eligible">0</div>
                    <div class="stat-label">Eligible</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="stat-filtered">0</div>
                    <div class="stat-label">Filtered Out</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="stat-recommended">0</div>
                    <div class="stat-label">Recommended</div>
                </div>
            </div>

            <!-- Filter Summary -->
            <div class="card filter-summary">
                <div class="card-header">
                    <h2>🔍 Filter Summary</h2>
                </div>
                <div class="card-body">
                    <div class="filter-tags" id="filter-tags">
                        <!-- Filter tags will be populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Match Results -->
            <div class="picks-section">
                <div class="section-header">
                    <h2>⭐ Top Recommendations</h2>
                    <span class="source-badge" title="AI Model">
                        🤖 AI Model
                    </span>
                </div>

                <div class="picks-grid" id="picks-grid">
                    <!-- Picks will be populated by JavaScript -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="results-actions">
                <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
                <button onclick="runMatching()" class="btn btn-primary">🔄 Run Again</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>AILT9019 - AI Literacy for Computing and Data Science | HKU 2026-27</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        // Load results when page loads
        document.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
